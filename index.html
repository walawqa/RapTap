<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F3EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Forma Życia" />
  <meta name="description" content="Mobilny planer diety i automatyczna lista zakupów." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <title>Forma Życia – dieta</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #F2F3EC;
      --bg-2: #E9EBE0;
      --surface: #FFFFFF;
      --surface-2: #F8F9F3;
      --surface-3: #EEF0E6;
      --text: #23271F;
      --muted: #6F7669;
      --muted-2: #9AA091;
      --line: #E2E4D7;
      --line-strong: #CDD1BF;
      --accent: #37594B;
      --accent-2: #4E7863;
      --accent-soft: rgba(55, 89, 75, .08);
      --accent-glow: rgba(55, 89, 75, .18);
      --danger: #A8503D;
      --warning: #B4842F;
      --ring-kcal: #37594B;
      --ring-protein: #6C8A54;
      --ring-fat: #BD8A47;
      --ring-carbs: #94748B;
      --shadow: 0 12px 30px rgba(30, 35, 27, .07);
      --shadow-sm: 0 4px 14px rgba(30, 35, 27, .06);
      --radius: 24px;
      --nav-height: 78px;
      --font-display: 'Manrope', ui-rounded, 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button, select, input, textarea { -webkit-appearance: none; appearance: none; }

    .app-shell { width: min(900px, 100%); margin: 0 auto; min-height: 100dvh; position: relative; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: calc(18px + env(safe-area-inset-top)) 18px 16px;
      background: rgba(242, 243, 236, .92);
      backdrop-filter: blur(18px) saturate(120%);
      border-bottom: 1px solid var(--line);
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fdfdfa;
      background: var(--accent);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-action {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      color: var(--accent);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      display: grid;
      place-items: center;
    }
    .header-action svg { width: 20px; height: 20px; stroke-width: 1.7; }

    main { padding: 18px 15px calc(var(--nav-height) + 30px + env(safe-area-inset-bottom)); }
    .view { display: none; animation: viewIn .22s ease; }
    .view.active { display: block; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .section-title {
      margin: 0 0 5px;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .section-subtitle { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .section-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 22px 2px 14px; }
    .section-heading:first-child { margin-top: 2px; }
    .section-heading .section-subtitle { margin-bottom: 0; }

    .card {
      position: relative;
      margin-bottom: 13px;
      padding: 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }
    .soft-card { background: var(--surface-2); box-shadow: none; }
    .hero-card {
      padding: 20px;
      border-color: var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .hero-card .muted-light { color: var(--muted); }

    .date-control { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
    .date-main { text-align: center; }
    .date-main strong {
      display: block;
      font-family: var(--font-display);
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 800;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .date-main span { display: block; margin-top: 3px; color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .weekday-picker { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 16px; }
    .weekday-btn {
      position: relative;
      min-width: 0;
      height: 40px;
      padding: 0 2px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .weekday-btn.active { color: #fdfdfa; border-color: var(--accent); background: var(--accent); }
    .assigned-plan {
      position: relative;
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface-2);
    }
    .assigned-plan span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .assigned-plan strong { display: block; margin-top: 5px; font-size: 17px; line-height: 1.25; color: var(--text); }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text);
      background: var(--surface);
      display: inline-grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
    }
    .hero-card .icon-btn { border-color: var(--line); color: var(--accent); background: var(--surface-2); }

    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    input, select, textarea {
      width: 100%;
      min-height: 44px;
      padding: 11px 14px;
      outline: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--surface);
    }
    select {
      padding-right: 34px;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 16px) 19px, calc(100% - 11px) 19px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    textarea { min-height: 86px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    input[type="color"] { padding: 5px; border-radius: 12px; }
    .hero-card select { color: var(--text); background-color: var(--surface); border: 1px solid var(--line); }
    .field-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field-row.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .btn {
      min-height: 44px;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: .01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary { color: #fdfdfa; border-color: var(--accent); background: var(--accent); }
    .btn-secondary { color: var(--accent); border-color: var(--line); background: var(--accent-soft); }
    .btn-ghost { color: var(--text); border-color: var(--line); background: transparent; }
    .btn-danger { color: var(--danger); border-color: rgba(168, 80, 61, .25); background: rgba(168, 80, 61, .09); }
    .btn-small { min-height: 36px; padding: 8px 14px; font-size: 12px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .macro-section-label { margin-top: 18px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .macro-rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
    .ring-item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
    .ring {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--ring-color, var(--accent)) calc(var(--pct) * 1%), var(--surface-3) 0);
    }
    .ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface); }
    .ring span { position: relative; z-index: 1; font-size: 11px; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
    .ring-label { font-size: 10px; color: var(--muted); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; line-height: 1.5; }
    .ring-label b { display: block; color: var(--text); font-size: 11px; font-weight: 800; text-transform: none; letter-spacing: 0; }

    .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 8px; }
    .macro { min-width: 0; padding: 11px 7px; text-align: center; border-radius: 14px; background: var(--surface-2); }
    .macro strong { display: block; color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
    .macro span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .macro.light { border: 1px solid var(--line); background: var(--surface); }

    .progress-wrap { margin-top: 16px; }
    .progress-meta { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .progress-track { height: 6px; overflow: hidden; border-radius: 999px; background: var(--surface-3); }
    .progress-bar { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .25s ease; }

    .meal-card { padding: 0; overflow: hidden; }
    .meal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 12px; }
    .meal-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .meal-index {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--accent);
      background: var(--accent-soft);
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
    }
    .meal-icon { display: none; }
    .meal-title h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.005em; color: var(--text); }
    .meal-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .check-circle {
      position: relative;
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      border: 1.5px solid var(--line-strong);
      border-radius: 50%;
      background: var(--surface);
    }
    .check-circle:checked { border-color: var(--accent); background: var(--accent); }
    .check-circle:checked::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 900; }
    .meal-card.completed { opacity: .55; }
    .meal-card.completed .meal-title h3 { text-decoration: line-through; }
    .ingredient-list { list-style: none; margin: 0; padding: 0 16px 12px 68px; }
    .ingredient-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); color: var(--text); font-size: 13px; }
    .ingredient-list li span:last-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .meal-note { margin: 0 16px 13px 68px; padding: 10px 12px; border-radius: 12px; color: var(--muted); background: var(--surface-2); font-size: 12px; line-height: 1.5; }
    .meal-macros { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 16px 68px; }
    .pill { padding: 5px 10px; border-radius: 999px; color: var(--muted); background: var(--surface-2); font-size: 10px; font-weight: 700; }

    .empty-state { padding: 40px 18px; text-align: center; color: var(--muted); }
    .empty-state strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 15px; }

    .week-nav, .shopping-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .week-label { text-align: center; }
    .week-label strong { display: block; font-size: 14px; }
    .week-label span { color: var(--muted); font-size: 11px; }
    .day-row { display: grid; grid-template-columns: 56px 1fr; gap: 13px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .day-row:last-child { border-bottom: 0; }
    .day-date {
      min-height: 54px;
      padding: 8px 4px;
      text-align: center;
      color: var(--text);
      border: 1px solid var(--line) !important;
      border-radius: 16px;
      background: var(--surface-2);
    }
    .day-date strong { display: block; font-family: var(--font-display); font-size: 16px; font-weight: 800; }
    .day-date span { display: block; margin-bottom: 2px; color: var(--muted-2); font-size: 8px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .day-date.today { color: #fdfdfa; border-color: var(--accent) !important; background: var(--accent); }
    .day-date.today span { color: rgba(255,255,255,.72); }
    .day-plan { min-width: 0; }
    .day-plan label.hint { letter-spacing: .03em; text-transform: uppercase; }
    .day-plan select { padding: 9px 34px 9px 12px; min-height: 41px; }
    .day-plan small { display: block; margin-top: 6px; overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }

    .shopping-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 13px; }
    .summary-box { padding: 12px 7px; text-align: center; border-radius: 14px; background: var(--surface-2); }
    .summary-box strong { display: block; color: var(--accent); font-size: 19px; font-variant-numeric: tabular-nums; }
    .summary-box span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
    .category-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 2px 8px; }
    .category-title h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 800; color: var(--text); }
    .category-title span { min-width: 26px; padding: 3px 8px; text-align: center; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 10px; font-weight: 700; }
    .shopping-item { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .shopping-item:last-child { border-bottom: 0; }
    .shopping-check { position: relative; width: 22px; height: 22px; border: 1.5px solid var(--line-strong); border-radius: 50%; background: var(--surface); }
    .shopping-check:checked { border-color: var(--accent); background: var(--accent); }
    .shopping-check:checked::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 900; }
    .shopping-item.done .shopping-name { color: var(--muted); text-decoration: line-through; }
    .shopping-name { color: var(--text); font-size: 13px; }
    .shopping-qty { color: var(--text); font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .hidden-bought { display: none; }

    .plan-card { position: relative; overflow: hidden; padding-left: 22px; }
    .plan-card::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 20px; width: 4px; border-radius: 999px; background: var(--plan-color, var(--accent)); }
    .plan-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .plan-top h3 { margin: 0; font-size: 16px; font-weight: 800; color: var(--text); }
    .plan-top p { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .plan-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin: 14px 0; }
    .plan-stat { padding: 10px 6px; text-align: center; border-radius: 12px; background: var(--surface-2); }
    .plan-stat strong { display: block; color: var(--accent); }
    .plan-stat span { color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: min(900px, 100%);
      height: calc(var(--nav-height) + env(safe-area-inset-bottom));
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 3px;
      border-top: 1px solid var(--line);
      background: rgba(242, 243, 236, .94);
      backdrop-filter: blur(20px) saturate(120%);
    }
    .nav-btn {
      min-width: 0;
      border: 0;
      border-radius: 16px;
      color: var(--muted);
      background: transparent;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .01em;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
    }
    .nav-btn .nav-icon { width: 21px; height: 21px; display: grid; place-items: center; }
    .nav-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .nav-btn.active { color: var(--accent); background: var(--accent-soft); }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; padding: 12px; display: none; align-items: flex-end; justify-content: center; background: rgba(30, 33, 26, .45); backdrop-filter: blur(4px); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(760px, 100%); max-height: calc(100dvh - 24px); overflow: auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); border: 1px solid var(--line); border-radius: 26px 26px 16px 16px; background: var(--surface); box-shadow: 0 30px 80px rgba(30,35,27,.24); }
    .modal-head { position: sticky; top: -18px; z-index: 2; margin: -18px -16px 14px; padding: 18px 18px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.96); backdrop-filter: blur(16px); }
    .modal-head h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 800; color: var(--text); }
    .meal-editor { margin: 12px 0; padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface-2); }
    .editor-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
    .editor-head strong { font-size: 13px; font-weight: 700; color: var(--text); }
    .ingredient-editor { display: grid; grid-template-columns: minmax(120px, 2fr) 78px 78px minmax(110px, 1fr) 38px; gap: 6px; margin-top: 7px; align-items: center; }
    .ingredient-editor input, .ingredient-editor select { min-height: 38px; padding: 8px 10px; font-size: 12px; }
    .include-shopping { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .include-shopping input { width: 18px; min-height: 18px; border: 1.5px solid var(--line-strong); border-radius: 5px; background: var(--surface); }
    .include-shopping input:checked { background: var(--accent); border-color: var(--accent); }

    .toast { position: fixed; left: 50%; bottom: calc(var(--nav-height) + 18px + env(safe-area-inset-bottom)); z-index: 150; max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 999px; color: #fdfdfa; background: var(--text); box-shadow: 0 14px 32px rgba(30,35,27,.28); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .2s ease; font-size: 12px; font-weight: 600; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .hint { color: var(--muted); font-size: 11px; line-height: 1.55; }
    .divider { height: 1px; margin: 14px 0; background: var(--line); }
    .danger-zone { border-color: rgba(168, 80, 61, .2); }

    @media (min-width: 640px) {

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function uid(prefix = 'id') { return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`; }
    function esc(value = '') {
      return String(value).replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#039;', '"':'&quot;' }[ch]));
    }
    function normalizeText(value = '') {
      return String(value).toLocaleLowerCase('pl-PL').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
    }
    function normalizeUnit(value = '') { return String(value).trim().toLocaleLowerCase('pl-PL').replace('sztuki', 'szt.').replace('sztuka', 'szt.'); }
    function toNumber(value) {
      const parsed = Number(String(value ?? '').replace(',', '.'));
      return Number.isFinite(parsed) ? parsed : 0;
    }
    function roundSmart(value) {
      const rounded = Math.round((Number(value) + Number.EPSILON) * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toLocaleString('pl-PL', { maximumFractionDigits: 1 });
    }
    function formatQty(amount, unit) { return `${roundSmart(amount)} ${unit || ''}`.trim(); }
    function startOfDay(date) { return new Date(date.getFullYear(), date.getMonth(), date.getDate()); }
    function addDays(date, days) { const d = new Date(date); d.setDate(d.getDate() + days); return startOfDay(d); }
    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function dateFromKey(key) { const [y,m,d] = key.split('-').map(Number); return new Date(y, m - 1, d); }
    function getMonday(date) {
      const d = startOfDay(date);
      const day = (d.getDay() + 6) % 7;
      return addDays(d, -day);
    }
    function dayIndex(date) { return (date.getDay() + 6) % 7; }
    function sameDay(a, b) { return dateKey(a) === dateKey(b); }
    function fmtDate(date, options) { return new Intl.DateTimeFormat('pl-PL', options).format(date); }
    function fmtMacro(value) { return Number(value || 0).toLocaleString('pl-PL', { maximumFractionDigits: 1 }); }
    function pct(value, total) { return total > 0 ? Math.max(0, Math.min(100, Math.round((toNumber(value) / total) * 100))) : 0; }

        return {
          ...clone(DEFAULT_STATE),
          ...stored,
          settings: { ...clone(DEFAULT_STATE.settings), ...(stored.settings || {}) },
          dateOverrides: stored.dateOverrides || {},
          mealProgress: stored.mealProgress || {},
          shoppingChecks: stored.shoppingChecks || {}
        };
      } catch (error) {
        console.warn('Nie udało się odczytać danych aplikacji:', error);
        return clone(DEFAULT_STATE);
      }
    }
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    }

    const SHOPPING_ALIASES = {
      'skyr naturalny pilos': 'Skyr naturalny',
      'skyr naturalny': 'Skyr naturalny',
      'skryr naturalny pilos': 'Skyr naturalny',
      'skryr naturalny': 'Skyr naturalny',
      'ser zolty high protein pilos': 'Ser żółty High Protein Pilos',
      'filet z piersi z kurczaka plastry': 'Filet z piersi z kurczaka – plastry'
    };

    function shoppingKey(start, days) { return `${dateKey(start)}|${days}`; }
    function buildShoppingList(start, days) {
      const map = new Map();
      for (let offset = 0; offset < days; offset++) {
        const date = addDays(start, offset);
        const plan = getPlanForDate(date);
        if (!plan) continue;
        for (const meal of plan.meals || []) {
          for (const ingredient of meal.ingredients || []) {
            if (ingredient.shopping === false || !ingredient.name || toNumber(ingredient.amount) === 0) continue;
            const normalized = normalizeText(ingredient.name);
            const displayName = SHOPPING_ALIASES[normalized] || ingredient.name.trim();
            const unit = normalizeUnit(ingredient.unit);
            const key = `${normalizeText(displayName)}|${unit}`;
            const existing = map.get(key) || { key, name: displayName, amount: 0, unit: ingredient.unit || '', category: ingredient.category || 'Inne' };
            existing.amount += toNumber(ingredient.amount);
            map.set(key, existing);
          }
        }
      }
      return [...map.values()].sort((a, b) => {
        const cat = CATEGORIES.indexOf(a.category) - CATEGORIES.indexOf(b.category);
        return cat || a.name.localeCompare(b.name, 'pl');
      });
    }

    function renderShopping() {
      const root = document.getElementById('view-shopping');
      const list = buildShoppingList(shoppingStart, shoppingDays);
      const rangeKey = shoppingKey(shoppingStart, shoppingDays);
      state.shoppingChecks[rangeKey] ||= {};
      const checks = state.shoppingChecks[rangeKey];
      const bought = list.filter(item => checks[item.key]).length;
      const categories = CATEGORIES.map(category => ({ category, items: list.filter(item => item.category === category) })).filter(group => group.items.length);
      const end = addDays(shoppingStart, shoppingDays - 1);

      root.innerHTML = `
        <div class="section-heading"><div><h2 class="section-title">Lista zakupów</h2><p class="section-subtitle">Ilości są sumowane automatycznie według stałych diet przypisanych do dni tygodnia.</p></div></div>
        <div class="card">
          <div class="shopping-nav">
            <button class="icon-btn" data-action="shopping-prev">‹</button>
            <div class="week-label"><strong>${esc(fmtDate(shoppingStart, { day:'numeric', month:'short' }))} – ${esc(fmtDate(end, { day:'numeric', month:'short', year:'numeric' }))}</strong><span>${shoppingDays} dni</span></div>
            <button class="icon-btn" data-action="shopping-next">›</button>
          </div>
          <div class="field-row" style="margin-top:13px">
            <div class="field"><label>Od dnia</label><input id="shoppingStartInput" type="date" value="${dateKey(shoppingStart)}" /></div>
            <div class="field"><label>Okres</label><select id="shoppingDaysSelect"><option value="7" ${shoppingDays===7?'selected':''}>7 dni</option><option value="14" ${shoppingDays===14?'selected':''}>14 dni</option><option value="30" ${shoppingDays===30?'selected':''}>30 dni</option></select></div>
          </div>
          <div class="shopping-summary">
            <div class="summary-box"><strong>${list.length}</strong><span>produktów</span></div>
            <div class="summary-box"><strong>${bought}</strong><span>kupione</span></div>
            <div class="summary-box"><strong>${list.length - bought}</strong><span>zostało</span></div>
          </div>
          <div class="button-row" style="margin-top:12px">
            <button class="btn btn-primary btn-small" data-action="copy-shopping">Kopiuj listę</button>
            <button class="btn btn-secondary btn-small" data-action="toggle-bought">${state.settings.hideBought ? 'Pokaż kupione' : 'Ukryj kupione'}</button>
            <button class="btn btn-ghost btn-small" data-action="clear-shopping">Odznacz wszystko</button>
          </div>
        </div>
        ${list.length ? categories.map(group => `
          <div class="category-title"><h3>${esc(group.category)}</h3><span>${group.items.length}</span></div>
          <div class="card" style="padding-top:3px;padding-bottom:3px">
            ${group.items.map(item => {
              const done = Boolean(checks[item.key]);
              return `<label class="shopping-item ${done ? 'done' : ''} ${done && state.settings.hideBought ? 'hidden-bought' : ''}">
                <input type="checkbox" class="shopping-check" data-shopping-item="${esc(item.key)}" ${done ? 'checked' : ''} />
                <span class="shopping-name">${esc(item.name)}</span>
                <span class="shopping-qty">${esc(formatQty(item.amount, item.unit))}</span>
              </label>`;
            }).join('')}
          </div>`).join('') : `<div class="card empty-state"><strong>Lista jest pusta</strong><p>Przypisz diety do dni tygodnia albo dodaj składniki oznaczone jako kupowane.</p></div>`}
        <div class="card soft-card"><p class="hint" style="margin:0"><strong>Ważne:</strong> aplikacja sumuje jednostki, np. gramy z gramami. Nie przelicza automatycznie gramów na opakowania lub sztuki, bo wielkości opakowań zależą od produktu.</p></div>`;

      root.querySelector('[data-action="shopping-prev"]').addEventListener('click', () => { shoppingStart = addDays(shoppingStart, -shoppingDays); renderShopping(); });
      root.querySelector('[data-action="shopping-next"]').addEventListener('click', () => { shoppingStart = addDays(shoppingStart, shoppingDays); renderShopping(); });
      root.querySelector('#shoppingStartInput').addEventListener('change', event => { if (event.target.value) shoppingStart = dateFromKey(event.target.value); renderShopping(); });
      root.querySelector('#shoppingDaysSelect').addEventListener('change', event => { shoppingDays = Number(event.target.value); renderShopping(); });
      root.querySelectorAll('[data-shopping-item]').forEach(input => input.addEventListener('change', event => {
        if (event.target.checked) checks[event.target.dataset.shoppingItem] = true; else delete checks[event.target.dataset.shoppingItem];
        saveState(); renderShopping();
      }));
      root.querySelector('[data-action="toggle-bought"]').addEventListener('click', () => { state.settings.hideBought = !state.settings.hideBought; saveState(); renderShopping(); });
      root.querySelector('[data-action="clear-shopping"]').addEventListener('click', () => { state.shoppingChecks[rangeKey] = {}; saveState(); renderShopping(); });
      root.querySelector('[data-action="copy-shopping"]').addEventListener('click', () => copyShoppingList(categories, checks, shoppingStart, end));
    }

    async function copyShoppingList(categories, checks, start, end) {
      const lines = [`LISTA ZAKUPÓW (${fmtDate(start, {day:'2-digit',month:'2-digit'})}–${fmtDate(end, {day:'2-digit',month:'2-digit',year:'numeric'})})`, ''];
      for (const group of categories) {
        lines.push(group.category.toUpperCase());
        group.items.forEach(item => lines.push(`${checks[item.key] ? '☑' : '☐'} ${item.name} – ${formatQty(item.amount, item.unit)}`));
        lines.push('');
      }
      try {
        await navigator.clipboard.writeText(lines.join('\n'));
        showToast('Lista zakupów skopiowana');
      } catch {
        const textarea = document.createElement('textarea');
        textarea.value = lines.join('\n'); document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); textarea.remove();
        showToast('Lista zakupów skopiowana');
      }
    }

    function newMeal() {

    function mealEditorHtml(meal, index) {

    function bindPlanEditorEvents() {
      const form = document.getElementById('planForm');
      els.modalContent.onclick = event => {
        const actionElement = event.target.closest('[data-action]');
        const action = actionElement?.dataset.action;
        if (action === 'close-modal') closeModal();
        if (action === 'add-meal') {
          const container = document.getElementById('mealEditors');
          container.insertAdjacentHTML('beforeend', mealEditorHtml(newMeal(), container.children.length));
        }
        if (action === 'remove-meal') {
          const all = els.modalContent.querySelectorAll('.meal-editor');
          if (all.length <= 1) return showToast('Dieta musi mieć przynajmniej jeden posiłek');
          actionElement.closest('.meal-editor').remove();
        }
        if (action === 'add-ingredient') {
          actionElement.closest('.meal-editor').querySelector('.ingredients-editors').insertAdjacentHTML('beforeend', ingredientEditorHtml());
        }
        if (action === 'remove-ingredient') actionElement.closest('.ingredient-editor').remove();
      };
      form.addEventListener('submit', event => {
        event.preventDefault();
        const plan = readPlanForm(form);
        const index = state.plans.findIndex(item => item.id === plan.id);
        if (index >= 0) state.plans[index] = plan; else state.plans.push(plan);
        saveState(); closeModal(); renderPlans(); showToast('Dieta zapisana');
      });
    }

    function readPlanForm(form) {
      const data = new FormData(form);
      return {
        id: form.dataset.planId,
        name: String(data.get('planName') || 'Dieta').trim(),
        shortName: String(data.get('planShortName') || data.get('planName') || 'Dieta').trim(),
        color: String(data.get('planColor') || '#16a34a'),
        description: String(data.get('planDescription') || '').trim(),
        meals: [...form.querySelectorAll('.meal-editor')].map(mealEl => ({
          id: mealEl.dataset.mealId || uid('meal'),
          name: mealEl.querySelector('[data-meal-field="name"]').value.trim() || 'Posiłek',
          time: mealEl.querySelector('[data-meal-field="time"]').value,
          icon: '',
          note: mealEl.querySelector('[data-meal-field="note"]').value.trim(),
          macros: {
            kcal: toNumber(mealEl.querySelector('[data-macro="kcal"]').value),
            protein: toNumber(mealEl.querySelector('[data-macro="protein"]').value),
            fat: toNumber(mealEl.querySelector('[data-macro="fat"]').value),
            carbs: toNumber(mealEl.querySelector('[data-macro="carbs"]').value)
          },
          ingredients: [...mealEl.querySelectorAll('.ingredient-editor')].map(ingEl => ({
            name: ingEl.querySelector('[data-ingredient-field="name"]').value.trim(),
            amount: toNumber(ingEl.querySelector('[data-ingredient-field="amount"]').value),
            unit: ingEl.querySelector('[data-ingredient-field="unit"]').value.trim(),
            category: ingEl.querySelector('[data-ingredient-field="category"]').value,
            shopping: ingEl.querySelector('[data-ingredient-field="shopping"]').checked
          })).filter(item => item.name)
        }))
      };
    }

    function duplicatePlan(planId) {
      const source = getPlan(planId); if (!source) return;
      const copy = clone(source); copy.id = uid('plan'); copy.name += ' – kopia'; copy.shortName += ' kopia';
      copy.meals.forEach(meal => meal.id = uid('meal'));
      state.plans.push(copy); saveState(); renderPlans(); showToast('Utworzono kopię diety');
    }
    function deletePlan(planId) {
      if (state.plans.length <= 1) return showToast('Musi zostać przynajmniej jedna dieta');
      const plan = getPlan(planId); if (!plan) return;
      if (!confirm(`Usunąć dietę „${plan.name}”?`)) return;
      state.plans = state.plans.filter(item => item.id !== planId);
      const fallback = state.plans[0]?.id || '';
      state.weeklySchedule = state.weeklySchedule.map(id => id === planId ? fallback : id);
      saveState(); renderPlans(); showToast('Dieta usunięta');
    }

    function renderSettings() {
      const root = document.getElementById('view-settings');
      root.innerHTML = `
        <div class="section-heading"><div><h2 class="section-title">Ustawienia</h2><p class="section-subtitle">Kopia danych, instalacja i przywracanie planu startowego.</p></div></div>
        <div class="card">
          <h3 style="margin-top:0">Instalacja na telefonie</h3>
          <p class="hint"><strong>iPhone:</strong> otwórz stronę w Safari → Udostępnij → „Do ekranu początkowego”.<br><strong>Android:</strong> otwórz stronę w Chrome → menu ⋮ → „Zainstaluj aplikację” lub „Dodaj do ekranu głównego”.</p>
          <button class="btn btn-primary" id="installAppBtn" ${deferredInstallPrompt ? '' : 'disabled'}>${deferredInstallPrompt ? 'Zainstaluj aplikację' : 'Instalacja dostępna z menu przeglądarki'}</button>
        </div>
        <div class="card">
          <h3 style="margin-top:0">Kopia danych</h3>
          <p class="hint">Diety i postępy są zapisane tylko w tej przeglądarce. Eksport pozwala przenieść je na inny telefon lub odzyskać po wyczyszczeniu danych.</p>
          <div class="button-row"><button class="btn btn-primary" data-action="export-data">Pobierz kopię JSON</button><label class="btn btn-secondary" style="cursor:pointer">Wczytaj kopię<input id="importDataInput" type="file" accept="application/json" hidden /></label></div>
        </div>
        <div class="card">
          <h3 style="margin-top:0">Źródło danych</h3>
          <p class="hint">Plan startowy został przepisany z pliku „2K26 FORMA ŻYCIA DIETA”. Makro jest zapisane na poziomie posiłków, a lista zakupów powstaje ze składników.</p>
        </div>
        <div class="card danger-zone">
          <h3 style="margin-top:0;color:var(--danger)">Przywrócenie danych</h3>
          <p class="hint">Usunie wszystkie własne zmiany, odznaczenia i dodane diety.</p>
          <button class="btn btn-danger" data-action="reset-data">Przywróć plan początkowy</button>
        </div>`;
      root.querySelector('[data-action="export-data"]').addEventListener('click', exportData);
      root.querySelector('#importDataInput').addEventListener('change', importData);
      root.querySelector('[data-action="reset-data"]').addEventListener('click', resetData);
      root.querySelector('#installAppBtn').addEventListener('click', installApp);
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = `forma-zycia-kopia-${dateKey(new Date())}.json`; a.click(); URL.revokeObjectURL(url);
      showToast('Kopia danych pobrana');
    }
    async function importData(event) {
      const file = event.target.files?.[0]; if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!Array.isArray(data.plans) || !data.plans.length) throw new Error('Nieprawidłowy plik');
        state = { ...clone(DEFAULT_STATE), ...data, settings: { ...clone(DEFAULT_STATE.settings), ...(data.settings || {}) } };
        saveState(); renderSettings(); showToast('Kopia danych wczytana');
      } catch { alert('Nie udało się wczytać pliku. Wybierz kopię utworzoną przez tę aplikację.'); }
      event.target.value = '';
    }
    function resetData() {
      if (!confirm('Na pewno przywrócić plan początkowy i usunąć wszystkie zmiany?')) return;
      state = clone(DEFAULT_STATE); saveState(); selectedDate = startOfDay(new Date()); shoppingStart = getMonday(new Date()); renderSettings(); showToast('Przywrócono plan początkowy');
    }
    async function installApp() {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt = null; renderSettings();
    }

    function openModal() { els.modalBackdrop.classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeModal() { els.modalBackdrop.classList.remove('open'); document.body.style.overflow = ''; els.modalContent.innerHTML = ''; }

    document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)));
    document.getElementById('goTodayBtn').addEventListener('click', () => { selectedDate = startOfDay(new Date()); setActiveTab('today'); });
    els.modalBackdrop.addEventListener('click', event => { if (event.target === els.modalBackdrop) closeModal(); });
    window.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); deferredInstallPrompt = event; if (activeTab === 'settings') renderSettings(); });

    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }

    renderToday();
  </script>
</body>
</html>
