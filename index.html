<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b10" />
  <title>BARZLAB — Rap Notes</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />

  <!-- iOS PWA hint -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>

<body>
  <div class="bg-noise"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">BL</div>
      <div class="brandText">
        <div class="brandName">BARZLAB</div>
        <div class="brandTag">write bars • save cloud • spit harder</div>
      </div>
    </div>

    <div class="topbarRight">
      <div id="userBadge" class="badge hidden"></div>
      <button id="btnLogout" class="btn ghost hidden">Wyloguj</button>
    </div>
  </header>

  <!-- AUTH -->
  <main id="authView" class="view">
    <div class="card authCard">
      <h1 class="h1">Zaloguj się</h1>
      <p class="muted">Twoje teksty są przypisane do konta i widoczne na wszystkich urządzeniach.</p>

      <div class="grid2">
        <div>
          <label class="label">Email</label>
          <input id="email" class="input" type="email" placeholder="np. ja@barzlab.com" />
        </div>
        <div>
          <label class="label">Hasło</label>
          <input id="password" class="input" type="password" placeholder="••••••••" />
        </div>
      </div>

      <div class="row">
        <button id="btnLogin" class="btn">Zaloguj</button>
        <button id="btnRegister" class="btn ghost">Załóż konto</button>
      </div>

      <div class="divider"><span>albo</span></div>

      <button id="btnGoogle" class="btn neon">
        <span class="dot"></span> Zaloguj przez Google
      </button>

      <div id="authMsg" class="msg hidden"></div>

      <div class="iosTip">
        iOS: żeby “zainstalować”, otwórz w Safari → Udostępnij → <b>Dodaj do ekranu początkowego</b>.
      </div>
    </div>
  </main>

  <!-- APP -->
  <main id="appView" class="view hidden">
    <section class="layout">
      <aside class="sidebar">
        <button id="btnNew" class="btn full neon">+ Nowy tekst</button>

        <div class="sidebarHead">
          <div class="h2">Twoje teksty</div>
          <input id="search" class="input" placeholder="Szukaj po tytule…" />
        </div>

        <div id="list" class="list"></div>
      </aside>

      <section class="editor">
        <div class="editorTop">
          <input id="title" class="titleInput" placeholder="Tytuł (np. Wysokie modele 2.0)" />

          <div class="tools">
            <select id="fontSelect" class="select">
              <option value="font-graffiti">Graffiti</option>
              <option value="font-mono">Studio Mono</option>
              <option value="font-sans">Street Sans</option>
            </select>

            <select id="sizeSelect" class="select">
              <option value="16">16px</option>
              <option value="18">18px</option>
              <option value="20">20px</option>
              <option value="24">24px</option>
            </select>

            <button id="btnStage" class="btn ghost">Tryb stage</button>
            <button id="btnInsertTags" class="btn ghost">[HOOK]/[VERSE]</button>
            <button id="btnDelete" class="btn danger">Usuń</button>
          </div>
        </div>

        <textarea id="body" class="textarea font-graffiti" placeholder="Wklej refren, zwrotki… pisz na vibe."></textarea>

        <div class="editorBottom">
          <div class="stats" id="stats">—</div>
          <div class="saveState" id="saveState">—</div>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
